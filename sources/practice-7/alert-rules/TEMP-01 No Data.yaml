apiVersion: 1
groups:
    - orgId: 1
      name: office-alerts
      folder: Smart Office
      interval: 10s
      rules:
        - uid: eg4ku9kw581s0e
          title: TEMP-01 No Data
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dg4kpi0rt87b4c
              model:
                editorMode: code
                expr: "office_sensor_age_seconds{job=\"office-controller\",sensor_id=\"TEMP-01\"}\r\nand on(job,instance)\r\n(up{job=\"office-controller\"} == 1)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            summary: Датчик TEMP-01 не передает показания более 20 секунд
          labels: {}
          isPaused: false
          notification_settings:
            receiver: my email
        - uid: fg4kun296ycxsd
          title: HUM-01 No Data
